openapi: 3.1.0
info:
  title: polaris-mail API
  version: 0.2.0
  description: |
    HMAC-authenticated REST surface for polaris-mail. All requests are signed with
    `X-Polaris-Sig: <hex(HMAC-SHA256(secret, canonical))>` where canonical is
    `polaris-api\n<METHOD>\n<path>\n<canonical-query>\n<X-Polaris-Ts>\n<X-Polaris-Nonce>\n<sha256-hex(body)>`.

    Webhooks delivered to subscribers (the WebhookEnvelope schema below) are signed
    `X-Polaris-Sig: <hex>` over the canonical string
    `polaris-webhook\nPOST\n<path>\n<canonical-query>\n<ts>\n<nonce>\n<sha256-hex(body)>`.
    Consumers should verify with the SDK (`@polaris-mail/sdk-node`'s `verifyWebhook`
    or `polariswebhook.VerifyWebhook` from `packages/sdk-go`).
servers:
  - url: https://polaris-mail-api.workers.dev
security:
  - HMACAuth: []
components:
  securitySchemes:
    HMACAuth:
      type: apiKey
      in: header
      name: X-Polaris-Sig
  parameters:
    KeyId:
      name: X-Polaris-Key-Id
      in: header
      required: true
      schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    Ts:
      name: X-Polaris-Ts
      in: header
      required: true
      schema: { type: string }
    Nonce:
      name: X-Polaris-Nonce
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Idempotency keys are scoped per principal: the same key string used by
        two different principals never collides. Retries from the same
        principal with the same key return the original `message_id`. Keys are
        cached for 24h.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
  schemas:
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    KeyScope:
      type: string
      enum:
        - send
        - 'messages:read'
        - 'imap_bridge:read'
        - 'admin:rotate'
        - 'admin:read'
        - 'admin:impersonate'
    Operator:
      type: object
      required: [id, name, email, ssh_pubkey_fp_sha256, api_key_id, role, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email }
        ssh_pubkey:
          type: string
          description: Full authorized_keys line. Omitted from list responses.
        ssh_pubkey_fp_sha256:
          type: string
          pattern: '^SHA256:[A-Za-z0-9+/]{43}$'
          description: SHA256 fingerprint matching `ssh-keygen -E sha256 -lf`.
        api_key_id: { $ref: '#/components/schemas/Ulid' }
        role: { type: string, enum: [admin, operator, readonly] }
        disabled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true }
    OperatorCreateRequest:
      type: object
      required: [name, email, ssh_pubkey, ssh_pubkey_fp_sha256]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email }
        ssh_pubkey: { type: string }
        ssh_pubkey_fp_sha256:
          type: string
          pattern: '^SHA256:[A-Za-z0-9+/]{43}$'
        role: { type: string, enum: [admin, operator, readonly], default: operator }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/KeyScope' }
          minItems: 1
          default: ['admin:read']
        rate_limit_per_min: { type: integer, minimum: 1, maximum: 100000, default: 600 }
    OperatorIssueResponse:
      type: object
      required: [api_key_id, api_key_prefix, api_key_secret, login_token]
      properties:
        operator: { $ref: '#/components/schemas/Operator' }
        api_key_id: { $ref: '#/components/schemas/Ulid' }
        api_key_prefix: { type: string }
        api_key_secret:
          { type: string, description: 'Returned ONCE — store via polaris-mail login.' }
        login_token:
          type: string
          pattern: '^polaris_[0-9A-HJKMNP-TV-Z]{26}\..+$'
          description: 'Convenience bundle (polaris_{key_id}.{secret}) for `polaris-mail login`.'
    OperatorUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        role: { type: string, enum: [admin, operator, readonly] }
        disabled: { type: boolean }
    OperatorRotatePubkeyRequest:
      type: object
      required: [ssh_pubkey, ssh_pubkey_fp_sha256]
      properties:
        ssh_pubkey: { type: string }
        ssh_pubkey_fp_sha256: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{43}$' }
    LoginResponse:
      type: object
      required: [operator]
      properties:
        operator:
          type: object
          required: [id, name, email, role, api_key_id]
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            name: { type: string }
            email: { type: string }
            role: { type: string, enum: [admin, operator, readonly] }
            api_key_id: { $ref: '#/components/schemas/Ulid' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, request_id]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - bad_content_type
                - bad_signature
                - key_propagating
                - clock_skew
                - key_revoked
                - scope_violation
                - nonce_replay
                - idempotency_conflict
                - domain_not_verified
                - recipient_rejected
                - rate_limited
                - too_many_requests
                - cf_upstream
                - degraded
                - not_found
                - unauthorized
                - forbidden
                - conflict
                # specialised conflict returned only by the genesis-seal
                # POST /v1/admin/bootstrap when the chain already has a
                # bootstrap row (PR 7).
                - already_bootstrapped
                # CF Email Service compliance
                - too_many_recipients
                - subject_too_long
                - message_too_large
                - header_not_allowed
                - header_too_long
                - too_many_custom_headers
                - custom_headers_too_large
            message: { type: string }
            retryable: { type: boolean }
            request_id: { type: string }
    MessageAttachment:
      type: object
      required: [filename, content_type, size_bytes]
      properties:
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        content_base64: { type: string }
        url:
          type: string
          format: uri
          description: |
            Public, content-addressed URL on the R2 custom domain
            `r2.mail.plrs.im`. Absolute, no expiry. SHA-256 in the
            path provides unguessability — treat the URL as a capability
            token. Fetch directly without HMAC.
    MessageAuth:
      type: object
      properties:
        spf: { type: string }
        dkim: { type: string }
        dmarc: { type: string }
        remote_ip: { type: string }
    Message:
      type: object
      required: [id, mailbox_id, direction, status, from, to, attachments, created_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        mailbox_id: { $ref: '#/components/schemas/Ulid' }
        direction: { type: string, enum: [in, out] }
        status:
          type: string
          enum: [received, mime_stored, queued, sending, sent, bounced, delivered, failed]
        from: { type: string }
        from_addr: { type: string, format: email }
        to:
          type: array
          items: { type: string }
        cc:
          type: array
          items: { type: string }
        bcc:
          type: array
          items: { type: string }
        subject: { type: string }
        text: { type: string }
        html: { type: string }
        body_url:
          type: string
          format: uri
          description: |
            Public, content-addressed URL for the raw RFC822 body on the R2
            custom domain `r2.mail.plrs.im`. Absolute, no expiry. SHA-256
            in the path provides unguessability — treat the URL as a
            capability token. Fetch directly without HMAC.
        headers:
          type: object
          additionalProperties: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/MessageAttachment' }
        header_message_id: { type: string }
        thread_id: { type: string }
        auth: { $ref: '#/components/schemas/MessageAuth' }
        body_bytes: { type: integer, minimum: 0 }
        attachments_total_bytes: { type: integer, minimum: 0 }
        received_at_bridge: { type: string }
        received_at_api: { type: string }
        queued_at: { type: string }
        sending_at: { type: string }
        sent_at: { type: string }
        delivered_at: { type: string }
        failed_at: { type: string }
        bounce_metadata: {}
        last_error: { type: string }
        created_at: { type: string }
        # IMAP / bridge per-mailbox state, populated when the response is
        # rendered for a mailbox-scoped caller (e.g. POST /v1/messages/get,
        # PATCH /v1/messages/:id, the mail-bridge mirror). See migration 0002
        # `mailbox_messages_state` for the source-of-truth shape.
        flags:
          type: array
          description: |
            IMAP flags for this message in the resolving mailbox. System flags
            (`\Seen`, `\Answered`, `\Flagged`, `\Deleted`) per RFC 9051 §2.3.2,
            plus any custom keywords the client has stored. Polaris does not
            ship `\Draft` (INBOX-only model — no folder dimension).
          items: { type: string }
        read_at:
          type: string
          nullable: true
          description: |
            ISO-8601 timestamp at which `\Seen` was first set in the resolving
            mailbox. `null` until the message is marked read.
        change_id:
          type: integer
          format: int64
          minimum: 0
          description: |
            Monotonic per-mailbox change cursor (IMAP CONDSTORE MODSEQ). Bumped
            on every state mutation; `GET /v1/mailboxes/:id/changes?since_state=`
            uses it for delta queries.
    SendRequestAttachment:
      type: object
      required: [filename, content_type, content_base64]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        content_type: { type: string, minLength: 1, maxLength: 255 }
        content_base64: { type: string }
    SendRequest:
      type: object
      required: [from, to]
      description: |
        JSON submission body for `POST /v1/messages` with `Content-Type: application/json`.
        Forbidden headers (date, message-id, from, to, cc, bcc, subject, content-type, etc.)
        MUST NOT appear in `headers`.
      properties:
        from: { type: string }
        to:
          type: array
          minItems: 1
          items: { type: string }
        cc:
          type: array
          items: { type: string }
        bcc:
          type: array
          items: { type: string }
        subject: { type: string }
        text: { type: string }
        html: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/SendRequestAttachment' }
        reply_to: { type: string }
        idempotency_key:
          type: string
          description: |
            Scoped per principal — see the `Idempotency-Key` header parameter.
            Two principals using the same string get independent claims; the
            same principal retrying gets the original `message_id`.
    SendResponse:
      type: object
      required: [message_id, status, fresh]
      properties:
        message_id: { $ref: '#/components/schemas/Ulid' }
        status: { type: string }
        fresh: { type: boolean }
    MessageList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        next_offset:
          type: integer
          nullable: true
    WebhookEventType:
      type: string
      enum:
        - message.received
        - message.sent
        - message.delivered
        - message.bounced
        - message.failed
    WebhookEnvelope:
      type: object
      required: [event_id, event, occurred_at, message]
      description: |
        v2 webhook envelope delivered to subscribers. The HTTP request carries
        `X-Polaris-Sig: <hex>`, `X-Polaris-Ts`, `X-Polaris-Nonce`,
        `X-Polaris-Event-Id`, and `X-Polaris-Event` headers. Verify with the SDK
        `verifyWebhook` helper.
      properties:
        event_id: { $ref: '#/components/schemas/Ulid' }
        event: { $ref: '#/components/schemas/WebhookEventType' }
        occurred_at: { type: string }
        message: { $ref: '#/components/schemas/Message' }
    Mailbox:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, nullable: true }
        default_sender_id:
          allOf:
            - { $ref: '#/components/schemas/Ulid' }
          nullable: true
        created_at: { type: string }
        updated_at: { type: string }
        disabled_at: { type: string, nullable: true }
    MailboxSender:
      type: object
      required: [id, mailbox_id, domain_id, address, default_for_mailbox, created_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        mailbox_id: { $ref: '#/components/schemas/Ulid' }
        domain_id: { $ref: '#/components/schemas/Ulid' }
        address: { type: string }
        local_part: { type: string, nullable: true }
        display_name: { type: string, nullable: true }
        default_for_mailbox: { type: integer, minimum: 0, maximum: 1 }
        created_at: { type: string }
        disabled_at: { type: string, nullable: true }
    MailboxReceiver:
      type: object
      required: [id, mailbox_id, domain_id, priority, address_pattern, action, enabled, created_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        mailbox_id: { $ref: '#/components/schemas/Ulid' }
        domain_id: { $ref: '#/components/schemas/Ulid' }
        priority: { type: integer }
        address_pattern: { type: string, minLength: 1, maxLength: 512 }
        action: { type: string, enum: [webhook, forward, drop] }
        webhook_sub_id:
          allOf:
            - { $ref: '#/components/schemas/Ulid' }
          nullable: true
        forward_to: { type: string, nullable: true }
        enabled: { type: integer, minimum: 0, maximum: 1 }
        created_at: { type: string }
        disabled_at: { type: string, nullable: true }
    MailDomain:
      type: object
      description: |
        Mail domain — the unit of DNS ownership for inbound (Email Routing
        CNAMEs + MX) and outbound (DKIM, SPF, DMARC, MTA-STS, TLS-RPT) email.
        Mirrors the `mail_domains` row shape after `services/api/migrations/
        0007_mta_sts.sql`. The Phase C MTA-STS + TLS-RPT fields drive
        self-hosted policy publishing under `mta-sts.{domain}`; see
        `_mta_sts_mode` for the lifecycle states.
      required:
        - id
        - zone_id
        - name
        - status
        - wildcard_subdomains
        - inbound_enabled
        - outbound_enabled
        - provider
        - created_at
        - updated_at
        - mta_sts_mode
        - mta_sts_max_age
        - tlsrpt_enabled
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        zone_id: { $ref: '#/components/schemas/Ulid' }
        parent_domain_id:
          allOf:
            - { $ref: '#/components/schemas/Ulid' }
          nullable: true
        name: { type: string }
        status: { type: string, enum: [pending, verifying, verified, failed, disabled] }
        wildcard_subdomains: { type: integer }
        dmarc_policy: { type: string, nullable: true }
        dmarc_rua: { type: string, nullable: true }
        inbound_enabled: { type: integer }
        outbound_enabled: { type: integer }
        provider: { type: string }
        cf_zone_id: { type: string, nullable: true }
        dkim_selector: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }
        verified_at: { type: string, nullable: true }
        last_verify_check_at: { type: string, nullable: true }
        disabled_at: { type: string, nullable: true }
        # MTA-STS (RFC 8461) + TLS-RPT (RFC 8460).
        mta_sts_mode:
          type: string
          enum: [none, testing, enforce]
          description: |
            Lifecycle state for self-hosted MTA-STS:
              - `none` — no policy published; senders fall back to opportunistic TLS.
              - `testing` — policy published with `mode: testing`; senders honour MX hosts
                but do NOT enforce on failure (TLS-RPT reports record violations).
              - `enforce` — policy published with `mode: enforce`; senders refuse delivery
                on policy failure.
        mta_sts_policy_id:
          type: string
          nullable: true
          description: |
            Opaque ULID/hash advertised as `id=` in the `_mta-sts.{domain}` TXT
            record and embedded in the served policy file. Rotated on every
            policy publish so MTA-STS-aware senders refresh their cached copy.
        mta_sts_max_age:
          type: integer
          minimum: 0
          description: |
            `max_age` (seconds) emitted in the served policy file (RFC 8461 §3.2).
            Default 86400 (1 day). Operators may raise this once policy is
            stable to extend sender-side caching.
        mta_sts_verified_at: { type: string, nullable: true }
        tlsrpt_enabled:
          type: integer
          minimum: 0
          maximum: 1
          description: |
            Whether the `_smtp._tls.{domain}` TXT record is published. Stored
            as INTEGER 0/1 to match the existing `inbound_enabled` /
            `outbound_enabled` pattern; PATCH accepts a boolean.
        tlsrpt_rua: { type: string, nullable: true }
        tlsrpt_verified_at: { type: string, nullable: true }
    UpdateMailDomainRequest:
      type: object
      description: |
        Generic patch surface for a mail domain. Note: switching MTA-STS state
        end-to-end (DNS + KV + DB) is normally routed through the dedicated
        lifecycle endpoints — `POST .../mta-sts/{enable,disable,promote}`
        so the publish side-effects fire. The fields here are accepted by
        bulk operator scripts that have already manually staged the records.
      properties:
        cf_zone_id: { type: string, maxLength: 64 }
        status: { type: string, enum: [pending, verifying, verified, failed, disabled] }
        dmarc_policy: { type: string, enum: [none, quarantine, reject] }
        dmarc_rua: { type: string, maxLength: 320 }
        dkim_selector: { type: string, minLength: 1, maxLength: 63 }
        mta_sts_mode: { type: string, enum: [none, testing, enforce] }
        mta_sts_max_age: { type: integer, minimum: 0 }
        tlsrpt_enabled: { type: boolean }
        tlsrpt_rua: { type: string }
    VerifyCheck:
      type: object
      description: |
        One row in the verify response. `actual` carries free-form hint text
        in addition to the observed value so the verify flow can express
        `missing` / `drift` / `unreachable` / `verified` states uniformly.
      required: [name, ok, expected, actual]
      properties:
        name: { type: string }
        ok: { type: boolean }
        expected: { type: string }
        actual: { type: string }
    VerifyResponse:
      type: object
      description: |
        Result of `POST /v1/admin/domains/:id/verify`. `status` reflects the
        DB-stored verification state after the run; `checks` is the per-record
        breakdown the panel renders.
      required: [id, status, checks]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        status: { type: string, enum: [pending, verifying, verified, failed, disabled] }
        checks:
          type: array
          items: { $ref: '#/components/schemas/VerifyCheck' }
        message: { type: string }
        verified_at: { type: integer, format: int64 }
    CreateMailboxRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
    CreateMailboxSenderRequest:
      type: object
      required: [local_part]
      properties:
        domain_id: { $ref: '#/components/schemas/Ulid' }
        local_part: { type: string, pattern: '^[a-z0-9._+-]{1,64}$' }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        default_for_mailbox: { type: boolean }
    CreateMailboxReceiverRequest:
      type: object
      required: [domain_id, address_pattern]
      properties:
        domain_id: { $ref: '#/components/schemas/Ulid' }
        priority: { type: integer, default: 100 }
        address_pattern: { type: string, minLength: 1, maxLength: 512 }
        action: { type: string, enum: [webhook, forward, drop], default: webhook }
        webhook_sub_id: { $ref: '#/components/schemas/Ulid' }
        forward_to: { type: string }
    IssueApiKeyRequest:
      type: object
      required: [mailbox_id]
      properties:
        mailbox_id: { $ref: '#/components/schemas/Ulid' }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        sender_ids:
          type: array
          items: { $ref: '#/components/schemas/Ulid' }
        scopes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/KeyScope' }
        rate_limit_per_min: { type: integer, default: 1000 }
    IssueApiKeyResponse:
      type: object
      required: [key_id, key_secret, prefix, created_at]
      properties:
        key_id: { type: string }
        key_secret: { type: string }
        prefix: { type: string }
        created_at: { type: integer, format: int64 }
    RotateRequest:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [planned, emergency] }
        reason: { type: string, maxLength: 500 }
        new_label: { type: string }
    RotateResponse:
      type: object
      properties:
        new_key_id: { type: string }
        new_key_secret: { type: string }
        prev_status: { type: string }
    CreateWebhookSubRequest:
      type: object
      required: [mailbox_id, url, kind, events]
      properties:
        mailbox_id: { $ref: '#/components/schemas/Ulid' }
        url: { type: string, format: uri }
        kind: { type: string, enum: [external, tailnet] }
        events:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WebhookEventType' }
    BridgeCredentialsResponse:
      type: object
      required: [updates, deletions, mirror_version]
      properties:
        updates:
          type: array
          items:
            type: object
            required: [id, username, bcrypt_hash, allowed_senders, mirror_version]
            properties:
              id: { type: string }
              username: { type: string }
              bcrypt_hash: { type: string }
              allowed_senders:
                type: array
                items: { type: string }
              mirror_version: { type: integer, format: int64 }
        deletions:
          type: array
          items: { type: string }
        mirror_version: { type: integer, format: int64 }
paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: ok
  /v1/messages:
    post:
      summary: Submit a message (JSON or RFC822)
      description: |
        Unified submission endpoint. Content-Type selects the auth flavor:
        - `application/json`: mailbox API-key HMAC, body is a SendRequest.
        - `message/rfc822`: per-bridge HMAC, body is raw RFC822 bytes.
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendRequest' }
          message/rfc822:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: accepted for processing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendResponse' }
        '400':
          description: bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      summary: List messages
      description: |
        Requires `messages:read` (or `admin:read` for cross-mailbox queries).
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
        - in: query
          name: mailbox_id
          schema: { $ref: '#/components/schemas/Ulid' }
        - in: query
          name: direction
          schema: { type: string, enum: [in, out] }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string }
        - in: query
          name: to
          schema: { type: string }
        - in: query
          name: since
          schema: { type: string }
        - in: query
          name: until
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageList' }
  /v1/messages/{id}:
    get:
      summary: Fetch one message
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      responses:
        '200':
          description: message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  # The previous `GET /v1/messages/{id}/attachments/{n}` signed-URL endpoint
  # was removed in B5. Each attachment in the Message response now carries
  # a `url` field that points to the R2 public custom domain
  # `r2.mail.plrs.im` directly — no signing, no expiry.
  /v1/admin/mailboxes:
    get:
      summary: List mailboxes
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Mailbox' }
    post:
      summary: Create a mailbox
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMailboxRequest' }
      responses:
        '201':
          description: created
  /v1/admin/mailboxes/{id}:
    get:
      summary: Get mailbox detail (with nested senders/receivers/principals/webhook_subs)
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      responses:
        '200':
          description: detail
    patch:
      summary: Update mailbox fields
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
                default_sender_id: { type: string, nullable: true }
      responses:
        '200':
          description: updated
  /v1/admin/mailboxes/{id}/disable:
    post:
      summary: Soft-disable a mailbox
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      responses:
        '200':
          description: disabled
  /v1/admin/mailboxes/{id}/enable:
    post:
      summary: Re-enable a mailbox
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      responses:
        '200':
          description: enabled
  /v1/admin/mailboxes/{id}/senders:
    post:
      summary: Create a mailbox_sender
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMailboxSenderRequest' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailboxSender' }
  /v1/admin/mailboxes/{id}/senders/{senderId}:
    delete:
      summary: Soft-disable a mailbox_sender
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
        - in: path
          name: senderId
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      responses:
        '200':
          description: disabled
  /v1/admin/mailboxes/{id}/receivers:
    post:
      summary: Create a mailbox_receiver
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMailboxReceiverRequest' }
      responses:
        '201':
          description: created
  /v1/admin/mailboxes/{id}/receivers/{receiverId}:
    patch:
      summary: Update a mailbox_receiver
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
        - in: path
          name: receiverId
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                priority: { type: integer }
                address_pattern: { type: string }
                action: { type: string, enum: [webhook, forward, drop] }
                webhook_sub_id: { type: string, nullable: true }
                forward_to: { type: string, nullable: true }
                enabled: { type: boolean }
      responses:
        '200':
          description: updated
    delete:
      summary: Soft-disable a mailbox_receiver
      parameters:
        - in: path
          name: id
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
        - in: path
          name: receiverId
          required: true
          schema: { $ref: '#/components/schemas/Ulid' }
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      responses:
        '200':
          description: disabled
  /v1/admin/api-keys:
    post:
      summary: Issue an api key bound to a mailbox principal
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueApiKeyRequest' }
      responses:
        '201':
          description: issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueApiKeyResponse' }
  /v1/admin/api-keys/{id}/rotate:
    post:
      summary: Rotate an api key
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - in: query
          name: dry_run
          schema: { type: string, enum: ['1'] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateRequest' }
      responses:
        '200':
          description: rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotateResponse' }
  /v1/admin/api-keys/{id}/revoke:
    post:
      summary: Revoke an api key
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateRequest' }
      responses:
        '200':
          description: revoked
  /v1/admin/webhook-subs:
    post:
      summary: Create a webhook subscription
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWebhookSubRequest' }
      responses:
        '201':
          description: created
  /v1/bridge/credentials:
    get:
      summary: Mail-bridge credential mirror
      description: |
        Returns the current set of active SMTP submission credentials plus
        the set of disabled credentials to remove. Polled by the
        mail-bridge to keep its local SQLite mirror current. (Renamed from
        `/v1/daemon/credentials` — the legacy alias is gone.)
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
        - in: query
          name: since
          schema: { type: integer }
      responses:
        '200':
          description: credential delta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BridgeCredentialsResponse' }
  /v1/admin/bootstrap:
    post:
      summary: One-time seed of the first admin key. Signed with POLARIS_SECRET_A.
      security: []
      parameters:
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: seeded
        '409':
          description: already consumed
  /v1/admin/operators:
    get:
      summary: List operators
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Operator' }
    post:
      summary: 'Create operator (atomically: principals + api_keys + operators rows)'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorCreateRequest' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorIssueResponse' }
        '409':
          description: email or fingerprint already in use
  /v1/admin/operators/lookup:
    get:
      summary: Lookup operator by SSH pubkey fingerprint (Wish hot path)
      parameters:
        - name: fingerprint
          in: query
          required: true
          schema: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{43}$' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  operator: { $ref: '#/components/schemas/Operator' }
        '404': { description: not found }
  /v1/admin/operators/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    get:
      summary: Show one operator (includes full SSH pubkey)
      responses: { '200': { description: ok } }
    patch:
      summary: Update operator name / role / disabled flag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorUpdateRequest' }
      responses: { '200': { description: ok } }
    delete:
      summary: 'Soft-disable operator (alias for PATCH with disabled=true)'
      responses: { '200': { description: ok } }
  /v1/admin/operators/{id}/rotate-key:
    post:
      summary: Rotate the operator's underlying api_key (returns new bearer once)
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      responses:
        '200':
          description: rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorIssueResponse' }
  /v1/admin/operators/{id}/rotate-pubkey:
    post:
      summary: Replace the operator's SSH pubkey (api_key unchanged)
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorRotatePubkeyRequest' }
      responses: { '200': { description: ok } }
  /v1/auth/login:
    post:
      summary: Validate an operator bearer and return cached operator profile (CLI login)
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '403':
          description: not an operator token
  /v1/auth/logout:
    post:
      summary: Audit-only logout signal (writes auth.logout row; no server-side revocation)
      responses:
        '200': { description: ok }
webhooks:
  message:
    post:
      summary: Webhook delivered to a subscriber
      description: |
        polaris-mail POSTs a `WebhookEnvelope` to each matching subscription URL.
        The request carries `X-Polaris-Sig: <hex>` signed over
        `polaris-webhook\nPOST\n<path>\n<canonical-query>\n<ts>\n<nonce>\n<sha256-hex(body)>`
        with the subscription's secret. Verify with the SDK
        `verifyWebhook(...)` helper.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEnvelope' }
      responses:
        '2XX':
          description: acknowledged

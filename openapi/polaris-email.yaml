openapi: 3.0.3
info:
  title: polaris-email API
  version: 0.1.0
  description: |
    HMAC-authenticated REST surface for polaris-email. All requests are signed with
    `X-Polaris-Sig: v1=<hex(HMAC-SHA256(secret, canonical))>` where canonical is
    `polaris-api.v1\n<METHOD>\n<path>\n<canonical-query>\n<X-Polaris-Ts>\n<X-Polaris-Nonce>\n<sha256-hex(body)>`.
servers:
  - url: https://polaris-email-api.workers.dev
security:
  - HMACAuth: []
components:
  securitySchemes:
    HMACAuth:
      type: apiKey
      in: header
      name: X-Polaris-Sig
  parameters:
    KeyId:
      name: X-Polaris-Key-Id
      in: header
      required: true
      schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }
    Ts:
      name: X-Polaris-Ts
      in: header
      required: true
      schema: { type: string }
    Nonce:
      name: X-Polaris-Nonce
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, request_id]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - bad_signature
                - key_propagating
                - clock_skew
                - key_revoked
                - scope_violation
                - nonce_replay
                - idempotency_conflict
                - domain_not_verified
                - recipient_rejected
                - rate_limited
                - cf_upstream
                - degraded
                - not_found
                - unauthorized
                - forbidden
                - conflict
            message: { type: string }
            retryable: { type: boolean }
            request_id: { type: string }
    IssueApiKeyRequest:
      type: object
      required: [tenant_id, sender_scopes]
      properties:
        tenant_id: { type: string, pattern: "^[a-z][a-z0-9-]{0,63}$" }
        sender_scopes:
          type: array
          minItems: 1
          items:
            oneOf:
              - { type: object, required: [kind, pattern], properties: { kind: { const: exact }, pattern: { type: string } } }
              - { type: object, required: [kind, pattern], properties: { kind: { const: glob }, pattern: { type: string } } }
              - { type: object, required: [kind, pattern], properties: { kind: { const: regex }, pattern: { type: string } } }
        scopes:
          type: array
          items: { type: string, enum: [send, "admin:rotate", "admin:read"] }
        rate_limit_per_min: { type: integer, default: 1000 }
    IssueApiKeyResponse:
      type: object
      required: [key_id, key_secret, prefix, created_at]
      properties:
        key_id: { type: string }
        key_secret: { type: string }
        prefix: { type: string }
        created_at: { type: integer, format: int64 }
    RotateRequest:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [planned, emergency] }
        reason: { type: string, maxLength: 500 }
        new_label: { type: string }
    RotateResponse:
      type: object
      properties:
        new_key_id: { type: string }
        new_key_secret: { type: string }
        prev_status: { type: string }
    CreateWebhookSubRequest:
      type: object
      required: [tenant_id, url, kind, events]
      properties:
        tenant_id: { type: string }
        domain_id: { type: string }
        url: { type: string, format: uri }
        kind: { type: string, enum: [external, tailnet] }
        events:
          type: array
          items:
            type: string
            enum:
              - message.received
              - message.bounced
              - message.sent
              - message.delivered
              - message.failed
              - credential.rotated
              - credential.revoked
paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: ok
  /v1/admin/api-keys:
    post:
      summary: Issue an api key
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueApiKeyRequest' }
      responses:
        '201':
          description: issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueApiKeyResponse' }
  /v1/admin/api-keys/{id}/rotate:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - in: query
          name: dry_run
          required: false
          schema: { type: string, enum: ['1'] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateRequest' }
      responses:
        '200':
          description: rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotateResponse' }
  /v1/admin/api-keys/{id}/revoke:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateRequest' }
      responses:
        '200':
          description: revoked
  /v1/admin/webhook-subs:
    post:
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWebhookSubRequest' }
      responses:
        '201':
          description: created
  /v1/admin/bulk/revoke-tenant:
    post:
      summary: Quarantine a tenant — revoke all its api keys
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, mode, confirmation, incident_ticket_id]
              properties:
                tenant_id: { type: string }
                mode: { type: string, enum: [emergency] }
                confirmation: { type: string }
                incident_ticket_id: { type: string }
      responses:
        '200':
          description: quarantined
  /v1/daemon/credentials:
    get:
      summary: Submission-daemon credential mirror
      description: |
        Returns the current set of active SMTP submission credentials plus
        the set of disabled credentials to remove. Polled by the
        submission-daemon to keep its local SQLite mirror current.
      parameters:
        - { $ref: '#/components/parameters/KeyId' }
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
        - name: since
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: credential delta
          content:
            application/json:
              schema:
                type: object
                required: [updates, deletions, mirror_version]
                properties:
                  updates:
                    type: array
                    items:
                      type: object
                      required: [id, username, bcrypt_hash, allowed_senders, mirror_version]
                      properties:
                        id: { type: string }
                        username: { type: string }
                        bcrypt_hash: { type: string }
                        allowed_senders:
                          type: array
                          items: { type: string }
                        mirror_version: { type: integer, format: int64 }
                  deletions:
                    type: array
                    items: { type: string }
                  mirror_version: { type: integer, format: int64 }
  /v1/admin/bootstrap:
    post:
      summary: One-time seed of the first admin key. Signed with POLARIS_SECRET_A.
      security: []
      parameters:
        - { $ref: '#/components/parameters/Ts' }
        - { $ref: '#/components/parameters/Nonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: seeded
        '409':
          description: already consumed

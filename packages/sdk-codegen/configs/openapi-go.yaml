# oapi-codegen config — emits a single-file client into
# `packages/sdk-go/generated.go`. Run via `go run` (`bin/regen.sh` invokes it
# because `oapi-codegen` is a Go binary, not a node module).
package: polarissdk
output: ../sdk-go/generated.go
generate:
  models: true
  client: true
  strict-server: false
  embedded-spec: false
output-options:
  skip-prune: true

# openapi-generator-cli config for the Python `python` generator (httpx
# backend + Pydantic v2 models). Output lands in
# `packages/sdk-python/polaris_sdk/generated/`.
generatorName: python
inputSpec: ../../openapi/polaris-email.yaml
outputDir: ../sdk-python/polaris_sdk/generated
packageName: polaris_sdk.generated
projectName: polaris-sdk
additionalProperties:
  library: httpx
  pythonPackageName: polaris_sdk.generated
  generateSourceCodeOnly: true
  pydanticV2: true
  useOneOfDiscriminatorLookup: true

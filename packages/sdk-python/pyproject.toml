[project]
name = "polaris-sdk"
version = "0.1.0"
description = "Python SDK for polaris-email."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
client = ["httpx>=0.27", "pydantic>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["polaris_sdk", "polaris_sdk.generated"]

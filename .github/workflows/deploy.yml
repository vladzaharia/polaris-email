name: deploy

# Routine redeploy of the Workers control plane.
# Triggered manually, or on push-to-main after CI is green.
#
# Gated on `vars.DEPLOY_ENABLED == 'true'` (repo Variables → Actions). When
# unset, the auto-after-CI trigger is a no-op. Flip it once the deploy
# secrets are seeded — see docs/operators/deployment/github-actions-setup.md
# or `polaris-email setup infra preflight` for the required surface.
on:
  workflow_dispatch:
    inputs:
      all:
        description: 'Deploy every service (true) or only changed since deployed/main (false)'
        required: false
        default: 'false'
  workflow_run:
    workflows: ['ci']
    types: [completed]
    branches: [main]

concurrency:
  group: polaris-email-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skip when the deploy hasn't been configured yet — auto-triggered runs
    # would otherwise fail at `polaris-email setup infra render` complaining
    # about 15 missing inputs. Manual `workflow_dispatch` still runs so the
    # operator gets a clear failure when they're trying to deploy on purpose.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the deployed/main tag
    env:
      DEPLOY_ALL: ${{ github.event.inputs.all }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Preflight — verify deploy secrets are configured
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DEPLOY_STATE_JSON: ${{ secrets.DEPLOY_STATE_JSON }}
          BOOTSTRAP_OUTPUT_JSON: ${{ secrets.BOOTSTRAP_OUTPUT_JSON }}
        run: |
          missing=()
          [ -n "$CF_API_TOKEN" ]         || missing+=("secrets.CLOUDFLARE_API_TOKEN")
          [ -n "$CF_ACCOUNT_ID" ]        || missing+=("secrets.CF_ACCOUNT_ID")
          [ -n "$DEPLOY_STATE_JSON" ]    || missing+=("secrets.DEPLOY_STATE_JSON")
          [ -n "$BOOTSTRAP_OUTPUT_JSON" ] || missing+=("secrets.BOOTSTRAP_OUTPUT_JSON")
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'deploy: missing required GitHub secret:\n'
            printf '  - %s\n' "${missing[@]}"
            printf '\nSeed locally with `polaris-email setup infra` then upload:\n'
            printf '  gh secret set DEPLOY_STATE_JSON     < .deploy-state.json\n'
            printf '  gh secret set BOOTSTRAP_OUTPUT_JSON < .bootstrap-output.json\n'
            printf '  gh secret set CLOUDFLARE_API_TOKEN  --body "$CF_API_TOKEN"\n'
            printf '  gh secret set CF_ACCOUNT_ID         --body "$CF_ACCOUNT_ID"\n'
            printf '  gh variable set DEPLOY_ENABLED      --body true\n'
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need full history to diff against deployed/main

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: apps/polaris-cli/go.sum

      - run: pnpm install --frozen-lockfile

      - name: Build polaris-email CLI
        working-directory: apps/polaris-cli
        run: make build

      - name: Restore deploy config from secrets
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SYNTHETIC_MONITOR_DOMAIN: ${{ vars.SYNTHETIC_MONITOR_DOMAIN }}
          POLARIS_API_HOSTNAME: ${{ vars.POLARIS_API_HOSTNAME }}
          BRIDGE_HOST: ${{ vars.BRIDGE_HOST }}
          ALERT_WEBHOOK: ${{ vars.ALERT_WEBHOOK }}
          SYNTHETIC_FROM: ${{ vars.SYNTHETIC_FROM }}
          SYNTHETIC_TO: ${{ vars.SYNTHETIC_TO }}
          DEPLOY_STATE_JSON: ${{ secrets.DEPLOY_STATE_JSON }}
          BOOTSTRAP_OUTPUT_JSON: ${{ secrets.BOOTSTRAP_OUTPUT_JSON }}
        run: |
          umask 077
          cat > .env.deploy <<EOF
          CF_ACCOUNT_ID="$CF_ACCOUNT_ID"
          CF_API_TOKEN="$CF_API_TOKEN"
          SYNTHETIC_MONITOR_DOMAIN="$SYNTHETIC_MONITOR_DOMAIN"
          POLARIS_API_HOSTNAME="$POLARIS_API_HOSTNAME"
          BRIDGE_HOST="$BRIDGE_HOST"
          ALERT_WEBHOOK="$ALERT_WEBHOOK"
          SYNTHETIC_FROM="$SYNTHETIC_FROM"
          SYNTHETIC_TO="$SYNTHETIC_TO"
          EOF
          printf '%s' "$DEPLOY_STATE_JSON"     > .deploy-state.json
          printf '%s' "$BOOTSTRAP_OUTPUT_JSON" > .bootstrap-output.json
          chmod 0600 .env.deploy .deploy-state.json .bootstrap-output.json

      - name: Render wrangler.local.jsonc files
        run: apps/polaris-cli/bin/polaris-email setup infra render

      - name: Resolve base SHA from deployed/main tag
        id: base
        run: |
          if git rev-parse --verify deployed/main >/dev/null 2>&1; then
            echo "sha=$(git rev-parse deployed/main)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            echo "$BASE_SHA" > .deploy-state.last-sha
          fi
          if [ "$DEPLOY_ALL" = "true" ]; then
            apps/polaris-cli/bin/polaris-email setup infra deploy all
          else
            apps/polaris-cli/bin/polaris-email setup infra deploy changed
          fi

      - name: Smoke
        run: apps/polaris-cli/bin/polaris-email setup infra smoke

      - name: Tag deployed/main at HEAD
        if: success()
        run: |
          git config user.name  'polaris-email-bot'
          git config user.email 'polaris-email-bot@users.noreply.github.com'
          git tag -f deployed/main HEAD
          git push -f origin deployed/main

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when a new commit is pushed to the same ref.
# github.ref is a builtin (refs/heads/main or refs/pull/N/merge) — never
# user-supplied text — so it's safe to interpolate directly here.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @polaris-email/test-vectors run generate
      - run: pnpm test:unit

  integration-test:
    # Pool-workers integration tests: real Miniflare + workerd, no Cloudflare
    # account required. Slower than `test` (one pool boot per file), so split
    # into a parallel job. Required check — keep alongside `test`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @polaris-email/test-vectors run generate
      - run: pnpm test:integration

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          # sdk-go has no go.sum (no external deps). Disable per-module cache to
          # avoid the action erroring on a missing dependency file.
          cache: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @polaris-email/test-vectors run generate
      - working-directory: packages/sdk-go
        run: go test ./...

  mail-bridge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: apps/mail-bridge/go.sum
      - working-directory: apps/mail-bridge
        run: go vet ./...
      - working-directory: apps/mail-bridge
        run: go test -race ./...

  compose-examples-drift:
    # The in-repo apps/mail-bridge/docker-compose.{local,tailscale}.yml
    # files are generated artefacts; the source of truth is
    # apps/polaris-cli/internal/setup/daemons/bridge/templates/. CI runs
    # `make compose-examples` and fails on any drift so an operator
    # editing the example file directly (instead of the template) is
    # caught at PR time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: apps/polaris-cli/go.sum
      - name: regenerate compose examples
        run: make -C apps/mail-bridge compose-examples
      - name: assert no drift
        run: git diff --exit-code apps/mail-bridge/docker-compose.local.yml apps/mail-bridge/docker-compose.tailscale.yml

  polaris-cli-test:
    # Unit tests for the polaris-email Go CLI, including the PR 9 setup
    # bridge wizard + platform helpers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: apps/polaris-cli/go.sum
      - working-directory: apps/polaris-cli
        run: go vet ./...
      - working-directory: apps/polaris-cli
        run: go test -race ./...

  openapi-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install --quiet pyyaml openapi-spec-validator
      - run: |
          python3 -c "from openapi_spec_validator import validate_spec; import yaml; validate_spec(yaml.safe_load(open('openapi/polaris-email.yaml')))"

  sql-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: "sqlite3 ':memory:' < services/api/migrations/0001_init.sql"

  cli-installer-test:
    # Tests the cli-installer Worker (`apps/cli-installer`). The Worker
    # bundles `src/install.sh` as a text module and serves it from
    # cli.mail.plrs.im. Three checks:
    #   1. typecheck the Worker entrypoint
    #   2. shellcheck the install script under POSIX sh
    #   3. vitest: Miniflare-based Worker tests + a Node-side shellcheck wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @polaris-email/cli-installer run typecheck
      - run: shellcheck -s sh apps/cli-installer/src/install.sh
      - run: pnpm --filter @polaris-email/cli-installer test

  docs:
    # Docusaurus site (apps/docs). PR 11 ships scaffolding; build must
    # stay green before any content lands in PR 12.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @polaris-email/docs run typecheck
      - run: pnpm --filter @polaris-email/docs run build:client
      - name: link-check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --root-dir ${{ github.workspace }}/apps/docs/build --exclude '^mailto:' --exclude 'mail\.plrs\.im' --exclude '^https?://github\.com' --accept '200,206,429' 'apps/docs/build/**/*.html'
          fail: true

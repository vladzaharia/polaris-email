name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when a new commit is pushed to the same ref — but
# never cancel CI runs on main. The deploy workflow consumes artifacts from
# the triggering CI run via workflow_run + run-id; cancelling main runs would
# leave deploy looking at an incomplete CI. github.ref is a builtin so it's
# safe to interpolate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ----------------------------------------------------------------------
  # Path filter — drives conditional layer-3 jobs.
  # ----------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.f.outputs.docs }}
      cli-installer: ${{ steps.f.outputs.cli-installer }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            docs:
              - 'apps/docs/**'
              - 'openapi/**'
              - 'packages/sdk-node/**'
              - 'services/api/src/routes/**'
            cli-installer:
              - 'apps/cli-installer/**'

  # ----------------------------------------------------------------------
  # Layer 0 — one-time workspace install. Uploads node_modules as a tarball
  # so downstream jobs don't re-run pnpm install (saves ~30-60s per job × 8
  # jobs in the old layout).
  # ----------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-pnpm
      - name: tar workspace node_modules
        # Single tarball preserves symlinks (pnpm's hoist-less layout depends
        # on them). upload-artifact@v4 treats the .tar as an opaque blob, so
        # symlinks survive untouched.
        run: |
          tar -cf workspace.tar \
            node_modules \
            $(find services apps packages -maxdepth 2 -name node_modules -type d 2>/dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: pnpm-workspace
          path: workspace.tar
          retention-days: 1
          if-no-files-found: error

  # ----------------------------------------------------------------------
  # Layer 1 — static checks. Parallel; depend on setup but not on builds.
  # ----------------------------------------------------------------------
  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/restore-pnpm-workspace
      - run: pnpm lint

  fmt-check:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/restore-pnpm-workspace
      - run: pnpm fmt:check

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/restore-pnpm-workspace
      - run: pnpm -r run typecheck

  openapi-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install --quiet pyyaml openapi-spec-validator
      - run: |
          python3 -c "from openapi_spec_validator import validate_spec; import yaml; validate_spec(yaml.safe_load(open('openapi/polaris-email.yaml')))"

  sql-validate:
    # Pre-PR behavior: validates only 0001_init.sql against a fresh
    # :memory: db. Verifies the canonical schema parses under SQLite.
    #
    # Why not "validate all 25 migrations":
    #   * migrations 0002+ INSERT into schema_migrations using
    #     `version INTEGER` — the migrations own that table, with a
    #     different schema than wrangler's. Any pre-seeded
    #     schema_migrations would conflict, and not pre-seeding would
    #     also fail since migrations expect it to exist.
    #   * SQLite eagerly validates VIEWs against their underlying
    #     tables; several migrations create a view referencing
    #     `messages_old` mid-rename which D1 (Workers) accepts but
    #     SQLite rejects.
    # The real validation happens at deploy time via
    # `wrangler d1 migrations apply --remote`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: "sqlite3 ':memory:' < services/api/migrations/0001_init.sql"

  # ----------------------------------------------------------------------
  # Layer 2 — build & generate. Produces artifacts consumed by Layer 3.
  # ----------------------------------------------------------------------
  build-test-vectors:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/restore-pnpm-workspace
      - run: pnpm --filter @polaris-email/test-vectors run generate
      - uses: actions/upload-artifact@v4
        with:
          name: vectors-json
          path: packages/test-vectors/vectors.json
          retention-days: 1
          if-no-files-found: error

  build-panel:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/restore-pnpm-workspace
      - run: pnpm --filter @polaris-email/panel run build
      - uses: actions/upload-artifact@v4
        with:
          name: panel-dist
          path: apps/panel/dist/
          retention-days: 1
          if-no-files-found: error

  build-docs:
    needs: [setup, changes]
    if: needs.changes.outputs.docs == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/restore-pnpm-workspace
      - run: pnpm --filter @polaris-email/docs run typecheck
      - run: pnpm --filter @polaris-email/docs run build:client
      - uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: apps/docs/build/
          retention-days: 1
          if-no-files-found: error

  build-polaris-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go-with-cache
        with:
          working-directory: apps/polaris-cli
      - working-directory: apps/polaris-cli
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: polaris-cli-bin
          path: apps/polaris-cli/bin/
          retention-days: 1
          if-no-files-found: error

  # ----------------------------------------------------------------------
  # Layer 3 — tests & integrations. Consume Layer 2 artifacts.
  # ----------------------------------------------------------------------
  test:
    needs: [setup, build-test-vectors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/restore-pnpm-workspace
      - uses: ./.github/actions/restore-build-artifacts
        with: { vectors: 'true' }
      - run: pnpm test:unit

  integration-test:
    # Pool-workers integration tests: real Miniflare + workerd, no Cloudflare
    # account required. Slower than `test` (one pool boot per file), so split
    # into a parallel job. Required check — keep alongside `test`.
    needs: [setup, build-test-vectors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/restore-pnpm-workspace
      - uses: ./.github/actions/restore-build-artifacts
        with: { vectors: 'true' }
      - run: pnpm test:integration

  go-test:
    needs: [setup, build-test-vectors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go-with-cache
        with:
          working-directory: packages/sdk-go
      - uses: ./.github/actions/restore-build-artifacts
        with: { vectors: 'true' }
      - working-directory: packages/sdk-go
        run: go test ./...

  mail-bridge-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go-with-cache
        with:
          working-directory: apps/mail-bridge
      - working-directory: apps/mail-bridge
        run: go vet ./...
      - working-directory: apps/mail-bridge
        run: go test -race ./...

  polaris-cli-test:
    # Unit tests for the polaris-email Go CLI, including the PR 9 setup
    # bridge wizard + platform helpers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go-with-cache
        with:
          working-directory: apps/polaris-cli
      - working-directory: apps/polaris-cli
        run: go vet ./...
      - working-directory: apps/polaris-cli
        run: go test -race ./...

  compose-examples-drift:
    # The in-repo apps/mail-bridge/docker-compose.{local,tailscale}.yml files
    # are generated artefacts; the source of truth is the templates under
    # apps/polaris-cli/internal/setup/daemons/bridge/templates/. CI runs
    # `make compose-examples` and fails on any drift so an operator editing
    # the example file directly (instead of the template) is caught at PR time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go-with-cache
        with:
          working-directory: apps/polaris-cli
      - name: regenerate compose examples
        run: make -C apps/mail-bridge compose-examples
      - name: assert no drift
        run: git diff --exit-code apps/mail-bridge/docker-compose.local.yml apps/mail-bridge/docker-compose.tailscale.yml

  cli-installer-test:
    # Worker bundles src/install.sh as a text module and serves it from
    # cli.mail.plrs.im. Three checks: typecheck Worker, shellcheck install
    # script under POSIX sh, vitest Miniflare-based Worker tests.
    needs: [setup, changes]
    if: needs.changes.outputs.cli-installer == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/restore-pnpm-workspace
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: pnpm --filter @polaris-email/cli-installer run typecheck
      - run: shellcheck -s sh apps/cli-installer/src/install.sh
      - run: pnpm --filter @polaris-email/cli-installer test

  docs-link-check:
    needs: build-docs
    if: needs.changes.outputs.docs == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/restore-build-artifacts
        with: { docs: 'true' }
      - name: link-check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --root-dir ${{ github.workspace }}/apps/docs/build --config lychee.toml --accept '200,206,429' 'apps/docs/build/**/*.html'
          fail: true

  # ----------------------------------------------------------------------
  # Aggregator — single required check. Set branch protection to require
  # only this job; `if: always()` guarantees we evaluate even when an
  # upstream fails, and toJSON(needs) covers skipped (path-filtered) jobs.
  # NEEDS is passed via env: so the jq expansion is never injected into
  # the shell command.
  # ----------------------------------------------------------------------
  ci-ok:
    if: always()
    needs:
      - lint
      - fmt-check
      - typecheck
      - openapi-validate
      - sql-validate
      - build-test-vectors
      - build-panel
      - build-polaris-cli
      - test
      - integration-test
      - go-test
      - mail-bridge-test
      - polaris-cli-test
      - compose-examples-drift
      - build-docs
      - docs-link-check
      - cli-installer-test
    runs-on: ubuntu-latest
    steps:
      - name: aggregate results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Required: success or skipped. Anything else (failure, cancelled) trips this.
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null

name: 'Setup Node + pnpm'
description: 'Checkout, set up pnpm + Node 22, install workspace deps with pnpm-store caching'

inputs:
  install:
    description: 'Run pnpm install. Set to false when the caller will restore node_modules from artifact.'
    required: false
    default: 'true'
  fetch-depth:
    description: 'Checkout fetch-depth. 0 = full history (needed by deploy for the deployed/main diff).'
    required: false
    default: '1'
  skip-checkout:
    description: 'Skip the checkout step. Use when the caller already checked out.'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - if: inputs.skip-checkout != 'true'
      uses: actions/checkout@v6
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

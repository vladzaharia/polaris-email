name: 'Restore pnpm workspace'
description: 'Download + untar the workspace.tar artifact produced by the setup job. Caller MUST run actions/checkout first.'

inputs:
  artifact-name:
    description: 'Artifact name produced by the setup job.'
    required: false
    default: 'pnpm-workspace'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: .
    - shell: bash
      run: |
        # The tarball preserves symlinks (pnpm's hoist-less layout depends on them).
        # If the file is missing or unpacked layout looks wrong, fail loud — a
        # half-restored workspace produces baffling test failures downstream.
        if [ ! -f workspace.tar ]; then
          echo "::error::workspace.tar artifact missing"
          exit 1
        fi
        tar -xf workspace.tar
        rm workspace.tar
        test -d node_modules || { echo "::error::no node_modules after restore"; exit 1; }
        test -d node_modules/.pnpm || { echo "::error::no node_modules/.pnpm after restore"; exit 1; }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>polaris-email panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font:
          14px system-ui,
          sans-serif;
        margin: 0;
      }
      nav {
        display: flex;
        gap: 12px;
        padding: 12px 20px;
        border-bottom: 1px solid #ddd;
      }
      nav a {
        color: #036;
        text-decoration: none;
      }
      main {
        padding: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 6px 10px;
        border-bottom: 1px solid #eee;
        text-align: left;
      }
      button {
        padding: 6px 12px;
      }
      .danger {
        background: #b00;
        color: white;
        border: none;
        padding: 6px 12px;
        cursor: pointer;
      }
      input,
      textarea {
        padding: 6px 8px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

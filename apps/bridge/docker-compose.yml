# polaris-email-bridge — singleton on the Tailnet.
# Mox + sidecar share Tailnet identity via the ts container.
# Mox is in its own docker network (no shared netns) — sidecar reverse-proxies for it.

networks:
  polaris-email:
    name: polaris-email

services:
  ts:
    image: tailscale/tailscale:stable
    container_name: polaris-email-ts
    hostname: polaris-email
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_EXTRA_ARGS: "--advertise-tags=tag:mail-bridge"
      TS_SERVE_CONFIG: /config/serve.json
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./ts-config:/config
      - ./mox-config/certs:/certs
    cap_add: [NET_ADMIN, NET_RAW]
    restart: unless-stopped

  cert-init:
    image: tailscale/tailscale:stable
    network_mode: service:ts
    depends_on: [ts]
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "tailscale cert --cert-file=/certs/mox.crt --key-file=/certs/mox.key polaris-email.$${TS_TAILNET}.ts.net"
    environment:
      TS_TAILNET: ${TS_TAILNET}
    volumes:
      - ./mox-config/certs:/certs
    restart: "no"

  mox:
    image: r.xmox.nl/mox:latest
    container_name: polaris-email-mox
    networks: [polaris-email]
    cap_drop: [ALL]
    read_only: true
    depends_on:
      cert-init:
        condition: service_completed_successfully
    volumes:
      - ./mox-data:/home/mox
      - ./mox-config:/etc/mox
    restart: unless-stopped

  sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    image: ghcr.io/polaris-email/bridge-sidecar:${SIDECAR_TAG:-dev}
    container_name: polaris-email-sidecar
    network_mode: service:ts
    cap_drop: [ALL]
    read_only: true
    depends_on: [mox]
    environment:
      POLARIS_EMAIL_URL: ${POLARIS_EMAIL_URL}
      POLARIS_BRIDGE_KEY_ID: ${POLARIS_BRIDGE_KEY_ID}
      POLARIS_BRIDGE_KEY_SECRET: ${POLARIS_BRIDGE_KEY_SECRET}
      MOX_WEBAPI_SOCK: /run/mox/webapi.sock
      LISTEN_PORT: "8088"
      POLL_INTERVAL_MS: "5000"
    volumes:
      - mox-sock:/run/mox:ro
    restart: unless-stopped

volumes:
  mox-sock:

# polaris-email-bridge — singleton on the Tailnet.
#
# All three services (mox, sidecar, cert-issuer) share the Tailscale netns
# via `network_mode: service:ts`. That gives them:
#   - a single Tailscale identity (the ts container's tailscale0 device);
#   - a shared loopback (127.0.0.1) so the sidecar reaches Mox's admin and
#     webapi listeners over loopback without exposing them to the tailnet;
#   - implicit firewall isolation: nothing on the bridge is reachable from
#     outside the tailnet except via the ts container's interfaces.
#
# Mox image pinning: r.xmox.nl/mox:latest is a moving tag. Pin to a tagged
# release; resolve to a sha256 digest on first pull and capture it here.
# As of 2026-05-11 the latest tagged release is v0.0.15 (2025-04-18).
# Mox's docker-release.sh deliberately doesn't auto-rebuild for Go runtime
# updates between Mox tags, so review CVEs in net/http + crypto when bumping.

services:
  ts:
    image: tailscale/tailscale:stable
    container_name: polaris-email-ts
    hostname: polaris-email
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_EXTRA_ARGS: "--advertise-tags=tag:mail-bridge"
      TS_SERVE_CONFIG: /config/serve.json
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./ts-config:/config
    cap_add: [NET_ADMIN, NET_RAW]
    restart: unless-stopped

  # Cert issuance via lego with Cloudflare DNS-01 (Mox can't do DNS-01
  # itself — autotls/autotls.go:5 explicitly says so). The cert lands on
  # the shared `certs` volume which Mox reads via KeyCerts in mox.conf.
  # Renewal is via the script's outer loop; Mox loads non-ACME KeyCerts
  # eagerly at startup, so a renewal requires a Mox restart to take
  # effect — the script touches /certs/.renewed so the sidecar can detect
  # it and trigger a graceful restart (sidecar pings ts netns: see
  # bin/bridge-up.sh and the sidecar's cert-watcher).
  cert-issuer:
    image: goacme/lego:v4.17.4
    container_name: polaris-email-cert-issuer
    network_mode: service:ts
    depends_on: [ts]
    environment:
      CLOUDFLARE_DNS_API_TOKEN: ${CF_API_TOKEN}
      BRIDGE_HOST: ${BRIDGE_HOST}
      CERT_EMAIL: ${CERT_EMAIL:-postmaster@${BRIDGE_HOST}}
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      'set -eu;
       while :; do
         if [ -f "/certs/${BRIDGE_HOST}.crt" ]; then
           lego --dns cloudflare --domains "${BRIDGE_HOST}" --email "${CERT_EMAIL}" --path /certs --accept-tos renew --days 30 || true;
         else
           lego --dns cloudflare --domains "${BRIDGE_HOST}" --email "${CERT_EMAIL}" --path /certs --accept-tos run;
         fi;
         # lego writes to /certs/certificates/<domain>.crt; mirror the
         # files to the paths Mox expects (KeyCerts in mox.conf).
         if [ -f "/certs/certificates/${BRIDGE_HOST}.crt" ]; then
           cp -f "/certs/certificates/${BRIDGE_HOST}.crt" "/certs/${BRIDGE_HOST}.crt";
           cp -f "/certs/certificates/${BRIDGE_HOST}.key" "/certs/${BRIDGE_HOST}.key";
           date -u +%FT%TZ > /certs/.renewed;
         fi;
         sleep 43200;
       done'
    volumes:
      - cert-vol:/certs
    restart: unless-stopped

  mox:
    # Pin by tag (digest captured on first pull; see bin/bridge-up.sh).
    image: r.xmox.nl/mox:v0.0.15
    container_name: polaris-email-mox
    # Share the Tailscale netns so the sidecar reaches admin/webapi on
    # 127.0.0.1 and SMTPS/IMAPS bind on the tailscale0 device.
    network_mode: service:ts
    cap_drop: [ALL]
    read_only: true
    depends_on:
      ts:
        condition: service_started
    volumes:
      - ./mox-data:/home/mox
      - ./mox-config:/etc/mox
      - cert-vol:/certs:ro
    restart: unless-stopped

  sidecar:
    build:
      context: ../..
      dockerfile: apps/bridge/sidecar/Dockerfile
    image: ghcr.io/vladzaharia/polaris-email-bridge-sidecar:${SIDECAR_TAG:-latest}
    container_name: polaris-email-sidecar
    network_mode: service:ts
    cap_drop: [ALL]
    read_only: true
    depends_on: [mox]
    environment:
      POLARIS_EMAIL_URL: ${POLARIS_EMAIL_URL}
      POLARIS_BRIDGE_KEY_ID: ${POLARIS_BRIDGE_KEY_ID}
      POLARIS_BRIDGE_KEY_SECRET: ${POLARIS_BRIDGE_KEY_SECRET}
      # HTTP base URLs for Mox admin + webapi. Both reachable on
      # 127.0.0.1 because mox and sidecar share the ts netns.
      MOX_ADMIN_URL: http://127.0.0.1:80
      MOX_WEBAPI_URL: http://127.0.0.1:80
      MOX_ADMIN_PASSWORD: ${MOX_ADMIN_PASSWORD}
      MOX_SUBMIT_HOST: "127.0.0.1"
      MOX_SUBMIT_PORT: "465"
      LISTEN_PORT: "8088"
      POLL_INTERVAL_MS: "5000"
    # Read the cert-renewal sentinel so the sidecar can trigger a Mox
    # restart when lego writes new cert files.
    volumes:
      - cert-vol:/certs:ro
    restart: unless-stopped

volumes:
  cert-vol:

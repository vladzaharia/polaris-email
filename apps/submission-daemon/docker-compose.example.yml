# Example deployment: daemon + tailscale sidecar + lego cert manager.
#
# Copy to docker-compose.yml and edit env vars / volumes for your host.
services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: polaris-tailscale
    hostname: polaris-daemon-1
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: 'false'
      TS_EXTRA_ARGS: --advertise-tags=tag:polaris-daemon
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add: [NET_ADMIN, NET_RAW]
    restart: unless-stopped

  lego:
    image: goacme/lego:latest
    container_name: polaris-lego
    network_mode: 'service:tailscale'
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    volumes:
      - lego-data:/.lego
    # Run on a schedule via cron / systemd-timer; placeholder command:
    command: >
      run --accept-tos --email ${ACME_EMAIL}
          --domains ${DAEMON_FQDN}
          --dns cloudflare
          --path /.lego

  daemon:
    image: ghcr.io/vladzaharia/polaris-daemon:latest
    container_name: polaris-daemon
    network_mode: 'service:tailscale'
    depends_on: [tailscale]
    environment:
      POLARIS_API_URL: https://api.polaris.example.com
      DAEMON_NAME: polaris-daemon-1
      DAEMON_ID_FILE: /run/secrets/daemon_id
      DAEMON_HMAC_KEY_FILE: /run/secrets/hmac_key
      ACCESS_CLIENT_ID: ${ACCESS_CLIENT_ID}
      ACCESS_CLIENT_SECRET: ${ACCESS_CLIENT_SECRET}
      TLS_CERT: /lego/certificates/${DAEMON_FQDN}.crt
      TLS_KEY: /lego/certificates/${DAEMON_FQDN}.key
      LISTEN_ADDR: ':465'
      POLL_INTERVAL: 5s
      MAX_MESSAGE_SIZE: '26214400'
      SQLITE_PATH: /var/lib/polaris-daemon/credstore.db
      AUDIT_LOG_PATH: /var/log/polaris-daemon/audit.log
    volumes:
      - lego-data:/lego:ro
      - daemon-data:/var/lib/polaris-daemon
      - daemon-logs:/var/log/polaris-daemon
      - ./secrets:/run/secrets:ro
    restart: unless-stopped

volumes:
  tailscale-state:
  lego-data:
  daemon-data:
  daemon-logs:

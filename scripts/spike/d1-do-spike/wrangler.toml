name = "polaris-d1-do-spike"
main = "src/worker.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "CONTROL"
database_name = "polaris-spike-control"
database_id = "REPLACE_WITH_ID_FROM_WRANGLER_D1_CREATE"

[[d1_databases]]
binding = "MESSAGES"
database_name = "polaris-spike-messages"
database_id = "REPLACE_WITH_ID_FROM_WRANGLER_D1_CREATE"

[[durable_objects.bindings]]
name = "DELIVERY"
class_name = "DeliveryDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeliveryDO"]
